[package]
name                   = "llvmkit-ir"
description            = "LLVM IR data model in pure Rust: types, values, modules, instructions, builder."
authors.workspace      = true
edition.workspace      = true
version.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true
keywords.workspace     = true
categories.workspace   = true

[features]
default = ["macros"]
# The dependency itself is unconditional: the crate's own types use
# `#[derive(Branded)]`. This feature gates only the user-facing macro
# re-exports (`IrStruct`, `#[function_pass]`, `#[module_pass]`).
macros = []

[dependencies]
bitflags  = "2"
boxcar    = "0.2"
llvmkit-macros = { workspace = true }
thiserror = { workspace = true }

# Expands the vendored TableGen tree into this crate's intrinsic tables. The
# manual entry point that used to be this crate's `gen_intrinsics` binary is now
# `llvmkit-tablegen`, shipped by that crate.
[build-dependencies]
llvmkit-tablegen = { workspace = true }

[dev-dependencies]
proptest = "1"
trybuild = "1"