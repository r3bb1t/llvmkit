[package]
name                   = "llvmkit-ir"
description            = "LLVM IR data model in pure Rust: types, values, modules, instructions, builder."
authors.workspace      = true
edition.workspace      = true
version.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true
keywords.workspace     = true
categories.workspace   = true

[features]
default = ["macros"]
# The dependency itself is unconditional: the crate's own types use
# `#[derive(Branded)]`. This feature gates only the user-facing macro
# re-exports (`IrStruct`, `#[function_pass]`, `#[module_pass]`).
macros = []
gen-intrinsics = []

[dependencies]
bitflags  = "2"
boxcar    = "0.2"
llvmkit-macros = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = "1"
trybuild = "1"

[[bin]]
name = "gen_intrinsics"
path = "tools/gen_intrinsics.rs"
required-features = ["gen-intrinsics"]