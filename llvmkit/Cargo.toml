[package]
name                   = "llvmkit"
description            = "Rust reimplementation of LLVM IR APIs."
authors.workspace      = true
edition.workspace      = true
version.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true
keywords.workspace     = true
categories.workspace   = true

[features]
default = ["macros"]
# Forwards to `llvmkit-ir/macros`: the user-facing macro re-exports
# (`IrStruct`, `#[function_pass]`, `#[module_pass]`). The proc-macro crate is
# compiled either way; this only gates the re-export surface.
macros = ["llvmkit-ir/macros"]

[dependencies]
llvmkit-support   = { workspace = true }
llvmkit-asmparser = { workspace = true }
llvmkit-ir        = { workspace = true, default-features = false }
